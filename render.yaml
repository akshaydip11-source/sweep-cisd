services:
  - type: web
    name: sweep-cisd
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: STATE_FILE
        value: /tmp/state.json
      - key: TWELVEDATA_API_KEY
        sync: false
