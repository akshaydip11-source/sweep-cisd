services:
  - type: web
    name: sweep-cisd
    runtime: docker
    plan: starter          # $7/mo: always-on (free plan sleeps -> EA heartbeats fail). Change to "free" for testing.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: TWELVEDATA_API_KEY
        sync: false
